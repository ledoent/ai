# The last entry below is a known Odoo 20.0 regression, not addon noise.
#
# oca_init_test_database passes --skip-auto-install on Odoo >= 19, so the test
# database holds only the declared dependency closure -- none of the ~100 core
# auto_install modules. On 20.0 that leaves core's own asset bundles
# unbuildable: compiling web.assets_frontend and web.assets_frontend_lazy logs
#
#   Error: argument `$color` of `rgba($color, $alpha)` must be a color
#           ... in function `color-contrast`
#           ... in mixin `button-outline-variant` (bootstrap/scss/mixins/_buttons.scss:41)
#
# A/B confirmed here: with --skip-auto-install, two warnings; without it, zero,
# same addons and same tests. It only bites addons whose tests build a frontend
# bundle (HttpCase, tour, Hoot), which is why most 20.0 PRs look green.
#
# The documented guidance is NOT to paper over it by declaring bus or other
# auto_install modules in depends -- this addon does not use them -- and CI
# always passes the flag, so an ignore entry is the only addon-side option.
# Drop it when core is fixed.
#
# Note: lines inside the `ignore=` value are regexes, not comments --
# configparser does not strip inline `#`, so explanations have to live up here.
[checklog-odoo]
ignore=
    WARNING.* 0 failed, 0 error\(s\).*
    WARNING .* Killing chrome descendants-or-self .*
    WARNING.* Missing widget: res_partner_many2one for field of type many2one.*
    WARNING.* must be a color.*
